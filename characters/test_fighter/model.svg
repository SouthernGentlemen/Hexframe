<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -110 80 120" width="80" height="120">
  <!--
    One <g> per rig part, each drawn around ITS OWN pivot at (0,0) so the renderer can
    rotate a part without first correcting for where it was drawn. Local coordinates are
    SVG-native — y increases downward — while rig.json measures pivots with y up; the
    renderer performs that flip once, in the stage, and nowhere else.

    Limbs hang downward from their pivot, which is why an upper arm occupies y 0..16. The
    torso is the exception: its pivot is the pelvis and it rises, so it occupies y -30..0.

    Colours are CSS custom properties with real fallbacks, so the lab can theme the
    fighter and a plain viewer still sees a fighter.
  -->
  <g id="leg_upper_l" fill="var(--fighter-far, #4a5a86)">
    <rect x="-5.5" y="0" width="11" height="24" rx="4.5"/>
  </g>
  <g id="leg_lower_l" fill="var(--fighter-far, #4a5a86)">
    <rect x="-5" y="0" width="10" height="22" rx="4"/>
  </g>
  <g id="foot_l" fill="var(--fighter-far-dark, #3b4a70)">
    <rect x="-4" y="0" width="16" height="6" rx="2.5"/>
  </g>

  <g id="arm_upper_l" fill="var(--fighter-far, #4a5a86)">
    <rect x="-4" y="0" width="8" height="16" rx="3.5"/>
  </g>
  <g id="arm_lower_l" fill="var(--fighter-far, #4a5a86)">
    <rect x="-3.5" y="0" width="7" height="14" rx="3"/>
  </g>
  <g id="hand_l" fill="var(--fighter-far-dark, #3b4a70)">
    <circle cx="0" cy="3" r="4.5"/>
  </g>

  <g id="pelvis" fill="var(--fighter-body, #7f8fd0)">
    <rect x="-9" y="-6" width="18" height="12" rx="4"/>
  </g>

  <g id="torso" fill="var(--fighter-body, #7f8fd0)">
    <rect x="-11" y="-30" width="22" height="30" rx="6"/>
    <!-- A chest stripe, so a rotation of the torso is visible at a glance in the lab. -->
    <rect x="-11" y="-18" width="22" height="3" fill="var(--fighter-accent, #c9d4ff)" opacity="0.65"/>
  </g>

  <g id="head" fill="var(--fighter-body, #7f8fd0)">
    <circle cx="1" cy="-11" r="11"/>
    <!-- The brow points forward. Without it a mirrored fighter is impossible to read. -->
    <path d="M 8 -15 L 14 -12 L 8 -9 Z" fill="var(--fighter-accent, #c9d4ff)"/>
  </g>

  <g id="leg_upper_r" fill="var(--fighter-near, #9aa9e8)">
    <rect x="-5.5" y="0" width="11" height="24" rx="4.5"/>
  </g>
  <g id="leg_lower_r" fill="var(--fighter-near, #9aa9e8)">
    <rect x="-5" y="0" width="10" height="22" rx="4"/>
  </g>
  <g id="foot_r" fill="var(--fighter-near-dark, #7686c4)">
    <rect x="-4" y="0" width="16" height="6" rx="2.5"/>
  </g>

  <g id="arm_upper_r" fill="var(--fighter-near, #9aa9e8)">
    <rect x="-4" y="0" width="8" height="16" rx="3.5"/>
  </g>
  <g id="arm_lower_r" fill="var(--fighter-near, #9aa9e8)">
    <rect x="-3.5" y="0" width="7" height="14" rx="3"/>
  </g>
  <g id="hand_r" fill="var(--fighter-near-dark, #7686c4)">
    <circle cx="0" cy="3" r="5"/>
  </g>
</svg>
