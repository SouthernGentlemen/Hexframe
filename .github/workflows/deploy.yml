# SHARED WIZARDGANG TEMPLATE.
# Production deploys a release tag, never an arbitrary main commit.
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Reproduce before deploying
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build with deployment identity
        env:
          RELEASE: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      - name: Verify production identity matches this release
        env:
          RELEASE: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          HOST: ${{ vars.PRODUCTION_HOST }}
        run: |
          sleep 10
          live=$(curl -fsS "https://$HOST/version.json")
          echo "$live"
          [ "$(printf '%s' "$live" | jq -r .release)" = "$RELEASE" ] \
            || { echo "::error::production release != $RELEASE"; exit 1; }
          [ "$(printf '%s' "$live" | jq -r .commit)" = "$GITHUB_SHA" ] \
            || { echo "::error::production commit != $GITHUB_SHA"; exit 1; }
          echo "Production identity matches $RELEASE @ $GITHUB_SHA"
