# SHARED WIZARDGANG TEMPLATE.
# Production deploys a release tag, never an arbitrary main commit.
#
# This workflow does NOT listen for `release: published`. It used to, and that trigger
# never fired: Release publishes with GITHUB_TOKEN, and GitHub deliberately refuses to
# start a workflow from an event raised by that token. v0.7.1 and v0.7.2 only deployed
# because the Release run failed and a human created those releases by hand; once HF-095
# fixed the tag check, Release started publishing and Deploy silently stopped running.
# Release now calls this workflow directly instead.
name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The commit actually checked out, which is the tag's commit. GITHUB_SHA is the
      # commit that triggered the run, so on a manual dispatch from a branch it names the
      # branch head rather than the tag being deployed, and the identity check below would
      # compare production against the wrong commit.
      - name: Resolve the deployed commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reproduce before deploying
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build with deployment identity
        env:
          RELEASE: ${{ inputs.tag }}
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      # The deploy has already happened by this point. This step decides whether it can
      # be *proven*, so it must separate "production is serving the wrong thing" from
      # "the edge would not talk to this runner". Cloudflare bot protection blocks
      # datacenter IPs, and GitHub runners are datacenter IPs, so a 403 here says nothing
      # about the deployment.
      - name: Verify production identity matches this release
        env:
          RELEASE: ${{ inputs.tag }}
          COMMIT: ${{ steps.target.outputs.sha }}
          HOST: ${{ vars.PRODUCTION_HOST }}
        run: |
          live=""
          for attempt in 1 2 3 4 5; do
            sleep $(( attempt * 5 ))
            code=$(curl -s -o /tmp/version.json -w '%{http_code}' "https://$HOST/version.json" || echo 000)
            if [ "$code" = "200" ]; then live=$(cat /tmp/version.json); break; fi
            echo "attempt $attempt: HTTP $code"
          done

          if [ -z "$live" ]; then
            echo "::error::Could not read https://$HOST/version.json from this runner (last status $code)."
            echo "::error::A 403 here is the edge refusing the runner, not a bad deploy — Cloudflare bot"
            echo "::error::protection blocks datacenter IPs. Add a WAF skip rule for /version.json, or"
            echo "::error::confirm by hand: curl -s https://$HOST/version.json"
            exit 1
          fi

          echo "$live"
          [ "$(printf '%s' "$live" | jq -r .release)" = "$RELEASE" ] \
            || { echo "::error::production release != $RELEASE"; exit 1; }
          [ "$(printf '%s' "$live" | jq -r .commit)" = "$COMMIT" ] \
            || { echo "::error::production commit != $COMMIT"; exit 1; }
          echo "Production identity matches $RELEASE @ $COMMIT"
